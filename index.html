
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baekhyun's iPhone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e5e2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;min-height:100vh;color:white}
.phone{width:min(360px,100vw);height:min(740px,96dvh);min-height:600px;border:7px solid #242424;border-radius:46px;overflow:hidden;position:relative;background:linear-gradient(155deg,#f6cada,#b7b8e8 55%,#f5d9d0);box-shadow:0 15px 40px #0003}
.status{display:flex;justify-content:space-between;padding:17px 22px;font-size:12px;font-weight:700}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#111;border-radius:20px;z-index:2}
.lock{text-align:center;padding-top:35px;text-shadow:0 2px 10px #5555}
.date{font-size:15px}
.clock{font-size:70px;font-weight:300;letter-spacing:-3px}
.greeting{font-size:14px;margin-top:5px}
.photo{margin:25px auto 15px;width:210px;height:235px;border-radius:25px;background:#ffffff40;border:1px solid #ffffff99;display:grid;place-items:center;text-align:center;padding:18px}
.photo span{font-size:48px}
.photo p{font-size:13px;line-height:1.8}
.bottom{position:absolute;bottom:18px;width:100%;text-align:center;font-size:12px}
.swipe{width:115px;height:4px;background:white;border-radius:10px;margin:13px auto 0}
.home{display:none;height:100%;padding:0 17px}
.welcome{padding-top:25px;font-size:24px;font-weight:700}
.sub{font-size:11px;margin-top:6px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 8px;margin-top:38px}
.app{text-align:center;font-size:11px;cursor:pointer}
.appicon{width:54px;height:54px;margin:0 auto 7px;border-radius:15px;background:#ffffffd9;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 9px #0001}
.dock{position:absolute;bottom:23px;left:12px;right:12px;background:#ffffff55;border-radius:23px;padding:11px;display:flex;justify-content:space-around}
.dock .appicon{margin:0}
button{font:inherit;border:0;cursor:pointer}
.page{display:none;position:absolute;inset:0;background:#f8f4f3;color:#333;padding:60px 18px 25px;overflow:auto}
.page h2{font-size:25px;margin:15px 0}
.back{position:absolute;top:14px;left:14px;background:#eee0e8;border-radius:20px;padding:9px 13px;color:#333}
.item{padding:15px;background:white;border-radius:15px;margin:10px 0;box-shadow:0 2px 10px #00008;line-height:1.7}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:13px;font-size:15px}
.chat{background:#f8e7a5;border-radius:14px;padding:12px;margin:12px 0 12px auto;max-width:85%;color:#333}
.note{font-size:12px;color:#888;line-height:1.6}
</style>
</head>
<body>
<div class="phone">
<div class="island"></div>

<div id="lock" onclick="unlock()">
<div class="status"><span>● SKT</span><span>●●● ▰</span></div>
<div class="lock">
<div class="date" id="date">10월 22일 목요일</div>
<div class="clock" id="clock">20:08</div>
<div class="greeting">오늘도 백현이와 함께 ♡</div>
<div class="photo"><div><span>🍀</span><p>MY DEAR BAEKHYUN<br>여기에 백현이 사진을 넣어 줘<br>우리만의 작은 아이폰 ♡</p></div></div>
</div>
<div class="bottom">화면을 눌러 홈 화면 열기<div class="swipe"></div></div>
</div>

<div id="home" class="home">
<div class="status"><span>● SKT</span><span>●●● ▰</span></div>
<div class="welcome">안녕, 에리 ♡</div>
<div class="sub">BAEKHYUN · MY LITTLE WORLD</div>
<div class="apps">
<div class="app" onclick="openPage('사진첩')"><div class="appicon">🌸</div>사진첩</div>
<div class="app" onclick="openPage('카카오톡')"><div class="appicon">💬</div>카카오톡</div>
<div class="app" onclick="openPage('통화')"><div class="appicon">📞</div>통화</div>
<div class="app" onclick="openPage('Safari')"><div class="appicon">🧭</div>Safari</div>
<div class="app" onclick="openPage('음악')"><div class="appicon">🎧</div>음악</div>
<div class="app" onclick="openPage('메모')"><div class="appicon">📝</div>메모</div>
<div class="app" onclick="openPage('설정')"><div class="appicon">⚙️</div>설정</div>
<div class="app" onclick="openPage('백현')"><div class="appicon">🍀</div>백현</div>
</div>
<div class="dock">
<div class="appicon" onclick="openPage('통화')">📞</div>
<div class="appicon" onclick="openPage('카카오톡')">💬</div>
<div class="appicon" onclick="openPage('Safari')">🧭</div>
<div class="appicon" onclick="openPage('음악')">🎵</div>
</div>
</div>

<div id="page" class="page">
<button class="back" onclick="closePage()">‹ 홈</button>
<h2 id="title"></h2>
<div id="content"></div>
</div>
</div>

<script>
function unlock(){
 document.getElementById('lock').style.display='none';
 document.getElementById('home').style.display='block';
}
function closePage(){
 document.getElementById('page').style.display='none';
 document.getElementById('home').style.display='block';
}
function openPage(name){
 document.getElementById('home').style.display='none';
 document.getElementById('page').style.display='block';
 document.getElementById('title').textContent=name;
 const c=document.getElementById('content');
 if(name==='사진첩'){
 c.innerHTML='<div class="item">🌸 나의 사진첩</div><div class="item">🍀 백현이 사진을 모으는 공간</div><p class="note">사진을 추가하려면 이 HTML 파일에 이미지 기능을 연결해야 해.</p>';
 }else if(name==='카카오톡'){
 c.innerHTML='<div class="item">💛 백현이와의 채팅</div><div class="chat">오늘도 행복한 하루 보내 ♡</div><div class="chat">에리들 항상 고마워 🍀</div><input class="search" id="msg" placeholder="메시지 입력"><button class="item" onclick="sendMsg()">보내기 ➤</button>';
 }else if(name==='통화'){
 c.innerHTML='<div class="item">📞 최근 통화</div><div class="item">🍀 백현이<br><span class="note">발신 · 시뮬레이션</span></div><button class="item" onclick="alert(\'가상 아이폰의 통화 화면이에요!\')">📞 전화 걸기</button>';
 }else if(name==='Safari'){
 c.innerHTML='<input class="search" id="query" placeholder="검색 또는 웹사이트 이름"><button class="item" onclick="searchWeb()">검색하기 🧭</button>';
 }else if(name==='음악'){
 c.innerHTML='<div class="item">🎧 BAEKHYUN PLAYLIST</div><div class="item">♫ Bambi</div><div class="item">♫ Cry For Love</div><div class="item">♫ Pineapple Slice</div><p class="note">곡 제목을 모아 둔 가상 플레이리스트예요.</p>';
 }else if(name==='메모'){
 c.innerHTML='<textarea id="memo" class="search" rows="6" placeholder="백현이에게 하고 싶은 말..."></textarea><button class="item" onclick="saveMemo()">메모 확인 ♡</button>';
 }else if(name==='설정'){
 c.innerHTML='<div class="item">⚙️ 설정</div><div class="item">배경화면 · 핑크 라벤더</div><div class="item">기기 이름 · BAEKHYUN PHONE</div><div class="item">소유자 · EXO-L ♡</div>';
 }else{
 c.innerHTML='<div class="item">🍀 BAEKHYUN</div><div class="item">나의 밝은 별 백현이 ♡</div><div class="item">언제나 응원할게</div>';
 }
}
function sendMsg(){
 const m=document.getElementById('msg');
 if(m&&m.value.trim()){
 const d=document.createElement('div');
 d.className='chat';d.textContent=m.value;
 document.getElementById('content').appendChild(d);m.value='';
 }
}
function searchWeb(){
 const q=document.getElementById('query').value.trim();
 if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
}
function saveMemo(){
 const m=document.getElementById('memo');
 if(m)alert('메모 내용\\n'+m.value);
}
function updateClock(){
 const n=new Date();
 document.getElementById('clock').textContent=
 String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 document.getElementById('date').textContent=
 (n.getMonth()+1)+'월 '+n.getDate()+'일 '+['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][n.getDay()];
}
updateClock();
setInterval(updateClock,30000);
</script>
</body>
</html>
